name: Build Pragmata Experimental

on:
  push:
    branches:
      - pragmata-hacking-ui-stereo-test
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-pragmata:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure CMake
        run: cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Pragmata
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target PRAGMATA

      - name: Package test build
        run: |
          echo ${{ github.sha }} > ${{ github.workspace }}/reframework_revision.txt
          7z a ${{ github.workspace }}/PRAGMATA-hacking-ui-stereo-test.zip ${{ github.workspace }}/reframework_revision.txt
          7z a ${{ github.workspace }}/PRAGMATA-hacking-ui-stereo-test.zip ${{ github.workspace }}/build/bin/PRAGMATA/dinput8.dll

      - name: Upload test build
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: PRAGMATA-hacking-ui-stereo-test
          path: ${{ github.workspace }}/PRAGMATA-hacking-ui-stereo-test.zip
          if-no-files-found: error
